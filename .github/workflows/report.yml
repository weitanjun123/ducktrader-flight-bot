name: Weekly flight report

on:
  schedule:
    - cron: "37 10 * * 0"   # Sunday 18:37 Singapore time
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send weekly report
        env:
          FLIGHT_BOT_TOKEN: ${{ secrets.FLIGHT_BOT_TOKEN }}
          FLIGHT_CHAT_ID: ${{ secrets.FLIGHT_CHAT_ID }}
        run: python bot/report.py
