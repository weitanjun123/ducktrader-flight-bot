name: Send notice
on:
  workflow_dispatch:
    inputs:
      text:
        description: "Message (HTML allowed)"
        required: true
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send Telegram message
        env:
          TOKEN: ${{ secrets.FLIGHT_BOT_TOKEN }}
          CHAT: ${{ secrets.FLIGHT_CHAT_ID }}
          TEXT: ${{ github.event.inputs.text }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" --data-urlencode "text=${TEXT}" \
            -d parse_mode=HTML -d disable_web_page_preview=true | head -c 200
